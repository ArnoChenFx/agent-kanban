# =============================================================================
# agent-kanban — one-command deployment
# -----------------------------------------------------------------------------
# Three steps:
#     cp .env.example .env          # set KANBAN_ADMIN_TOKEN (openssl rand -hex 16)
#     docker compose up -d
#     docker compose exec kanban kanban admin project add my-app
#     docker compose exec kanban kanban admin token create --project my-app --name ci
#
# Why a single service:
#   The server does not terminate TLS and binds to loopback by default — HTTPS
#   belongs to infrastructure that already has it (a corporate gateway, nginx, a
#   Kubernetes Ingress, a VPN-only network). Running a certificate-renewal
#   container for a task board is not worth the extra failure surface: an
#   expired cert becomes a total outage. When you do need to expose it, set
#   KANBAN_BIND=0.0.0.0 and put it behind your own terminator.
#   ⚠ Without TLS, tokens travel in plaintext. Confirm there is a terminator
#     in front before exposing this beyond localhost.
# =============================================================================

name: agent-kanban

services:
  kanban:
    image: ghcr.io/arnochenfx/agent-kanban:latest

    # ⚠ Loopback only by default. To reach it from other machines on the LAN,
    # set KANBAN_BIND=0.0.0.0 in .env — after reading the TLS note above.
    ports:
      - "${KANBAN_BIND:-127.0.0.1}:${KANBAN_PORT:-7788}:7788"

    environment:
      # The container must bind 0.0.0.0 to receive traffic from the Docker
      # network. How far that is reachable is decided by the **host-side**
      # binding in `ports` above — the two are different things.
      KANBAN_HOST: "0.0.0.0"
      KANBAN_PORT: "7788"

      # Admin token: must be `k_` followed by 32 lowercase hex characters.
      # Leave it empty and the server generates one on first boot, prints it
      # once, and writes it to /data/.kanban/config.toml. Setting it here means
      # the token survives container rebuilds and is never printed in plaintext
      # or written to the config file — the right choice for CI / K8s Secrets.
      KANBAN_ADMIN_TOKEN: "${KANBAN_ADMIN_TOKEN:-}"

      # Where `kanban serve` looks for the built frontend.
      KANBAN_WEB_DIR: /opt/kanban/web

    volumes:
      # Projects, tokens, tasks, handoffs and config.toml all live here.
      # To move machines:
      #   docker run --rm -v kanban-data:/data -v $PWD:/out alpine tar czf /out/kanban.tgz -C /data .
      - kanban-data:/data

    restart: unless-stopped
    # The server reaps stale sessions on a 30s timer internally; the container
    # layer only needs to keep the process alive.
    stop_grace_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7788/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    security_opt:
      - no-new-privileges:true

volumes:
  # Business data: the SQLite database + config.toml (which holds the admin
  # token, in plaintext or hashed).
  kanban-data:
