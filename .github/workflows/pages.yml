# =============================================================================
# Publish the product website (site/) to GitHub Pages.
# The board web UI (web/) is the product and needs a backend server - it is
# NOT published here. The site is a static landing page, assembled at deploy
# time from site/ plus screenshots from docs/images/.
# =============================================================================

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (copy screenshots)
        run: |
          mkdir -p site/images
          cp docs/images/*.png site/images/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
