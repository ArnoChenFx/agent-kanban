# =============================================================================
# 发布：tag 触发 → 跨平台二进制 + Docker 镜像 + GitHub Release
# =============================================================================
# 触发：推送形如 v1.2.3 的 tag
#
# 产物：
#   · 5 个平台的自包含二进制（bun build --compile，用户下载即用，无需装 bun）
#   · Docker 镜像（linux/amd64 + linux/arm64），推送到 GHCR 与 Docker Hub
#   · GitHub Release 附二进制 + 校验和
#
# 三条硬约束（改 workflow 前先读）：
#   1. tag 与 package.json.version 必须一致 —— 版本号只能有一个来源，
#      否则「这个二进制到底是哪版」会变成查不到的问题。
#   2. 二进制必须内嵌 schema.sql —— 靠 `with { type: "file" }`（src/core/db.ts）。
#      漏掉会在运行时报 ENOENT，而编译期完全看不出来，所以每个平台都要 smoke test。
#   3. 先跑测试再发产物 —— 发布出去的不能是红的。
# =============================================================================

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # 创建 Release / 上传资产
  packages: write # 推 GHCR

concurrency:
  # 同一 tag 重跑时取消上一次；不同 tag 并行
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  # ---------------------------------------------------------------------------
  # 前置门禁：版本一致 + 测试全绿
  # ---------------------------------------------------------------------------
  verify:
    name: 版本校验与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # 版本号单一来源校验：tag 的 v1.2.3 必须等于 package.json 的 1.2.3
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag 版本 ($TAG) 与 package.json ($PKG) 不一致"
            echo "发布前请先更新 package.json 并提交，或改用正确的 tag"
            exit 1
          fi
          echo "版本一致：$PKG"

      - name: 安装依赖
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      # 发布产物必须自带前端，所以这里要构建并生成资源清单
      - name: 前端构建（发布产物需内嵌）
        run: |
          cd web && bun run build
          cd .. && bun run gen:assets

      - name: 类型检查（后端）
        run: bun run typecheck

      - name: 类型检查（前端）
        run: bun run typecheck
        working-directory: web

      - name: 单元测试
        run: bun test

      - name: 前端构建
        run: bun run build
        working-directory: web

      # 端到端脚本：崩溃恢复 / 事件重放 / 远程双模式 / Web 看板
      # 它们自己起临时 server，跑完自动清理
      - name: 端到端验证
        run: |
          bun run scripts/verify-recovery.ts
          bun run scripts/verify-rebuild.ts
          bun run scripts/verify-auth.ts
          bun run scripts/verify-remote.ts
          bun run scripts/verify-web.ts

  # ---------------------------------------------------------------------------
  # 跨平台二进制
  # ---------------------------------------------------------------------------
  binary:
    name: 二进制 ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            asset: kanban-linux-x64
            suffix: ""
          - target: bun-linux-arm64
            os: ubuntu-latest
            asset: kanban-linux-arm64
            suffix: ""
          - target: bun-darwin-x64
            os: macos-latest
            asset: kanban-darwin-x64
            suffix: ""
          - target: bun-darwin-arm64
            os: macos-latest
            asset: kanban-darwin-arm64
            suffix: ""
          - target: bun-windows-x64
            os: windows-latest
            asset: kanban-windows-x64.exe
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # 二进制不依赖 node_modules，但 bun build 仍需解析依赖 → 先装
      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 编译
        shell: bash
        run: |
          # 顺序重要：先构建前端 → 生成资源清单 → 再编译。
          # 少一步二进制里就没有前端（`/` 会退回占位页），而且编译不会报错。
          bun run gen:assets
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} \
            src/cli.ts --outfile "dist/${{ matrix.asset }}"
          ls -lh dist/

      # ⚠ 关键 smoke test：schema.sql 内嵌问题在编译期不可见，
      # 必须在**目标平台**上真的跑一次 init 才能确认产物可用。
      # arm64 产物在 x64 runner 上无法直接运行，改用容器化验证。
      - name: 冒烟测试（版本 + 初始化）
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.asset }}"

          if [ "${{ matrix.target }}" = "bun-linux-arm64" ]; then
            # x64 runner 上跑不了 arm64：放进 qemu 模拟
            docker run --rm --platform linux/arm64 -v "$PWD/dist:/d" \
              oven/bun:1.4.2-alpine /d/${{ matrix.asset }} --version
            docker run --rm --platform linux/arm64 -v "$PWD/dist:/d" -v "$PWD/smoke:/w" \
              -w /w oven/bun:1.4.2-alpine /d/${{ matrix.asset }} init
            echo "arm64 冒烟通过（qemu）"
            exit 0
          fi

          chmod +x "$BIN" || true
          "$BIN" --version
          mkdir -p smoke
          ( cd smoke && "../$BIN" init >/dev/null && "../$BIN" task add "发布冒烟" >/dev/null && \
            "../$BIN" --json task list | grep -q T-0001 )
          echo "冒烟通过：init / task add / task list"

      - name: 校验和
        id: sum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            # macOS 用 shasum
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker 镜像（多架构）
  # ---------------------------------------------------------------------------
  docker:
    name: Docker 镜像
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        # secrets 未配置时跳过（GHCR 始终可用，Docker Hub 是可选项）
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送（GHCR）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agent-kanban:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/agent-kanban:latest
          labels: |
            org.opencontainers.image.title=agent-kanban
            org.opencontainers.image.description=多会话 agent 共享的任务看板（server）
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 推送 Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-kanban:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-kanban:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把镜像摘要写进输出，Release 里引用
      - name: 记录镜像 digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}/agent-kanban:${{ github.ref_name }} \
            --format '{{json .Manifest}}' | head -c 200 || echo "unknown")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${{ github.repository }}/agent-kanban:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: 创建 Release
    needs: [binary, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 汇总产物
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name 'kanban-*' \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: 生成 Release 说明
        run: |
          cat > release-notes.md <<EOF
          ## agent-kanban ${{ github.ref_name }}

          多会话 agent 共享的项目级任务看板：任务共享、进度可追溯，agent 崩溃后能恢复上下文与交接。

          ### 下载

          | 平台 | 文件 |
          | --- | --- |
          | Linux x64 | \`kanban-linux-x64\` |
          | Linux arm64 | \`kanban-linux-arm64\` |
          | macOS x64 | \`kanban-darwin-x64\` |
          | macOS arm64 | \`kanban-darwin-arm64\` |
          | Windows x64 | \`kanban-windows-x64.exe\` |

          二进制是**自包含**的（内嵌 bun 运行时与数据库 schema），下载即用，无需安装 bun。
          Linux 版本需给执行权限：\`chmod +x kanban-linux-x64\`。

          ### Docker

          \`\`\`bash
          # 启动 server（Web 看板 + CLI 远程后端）
          docker run -d --name kanban -p 7788:7788 -v kanban-data:/data \\
            ghcr.io/${{ github.repository }}/agent-kanban:${{ github.ref_name }}

          # 首次启动会打印管理员 token，用它签发 project token
          docker logs kanban
          \`\`\`

          数据卷 \`/data\` 存放 project、token、任务与交接；换机器时备份这个目录即可迁移。

          常用环境变量：\`KANBAN_PORT\`（默认 7788）、\`KANBAN_HOST\`（默认 0.0.0.0）、\`KANBAN_WEB_DIR\`。

          ### 快速开始

          \`\`\`bash
          kanban init                      # 初始化本地看板
          kanban session start --agent pi-main
          kanban task add "实现存储层"
          kanban context                   # 读现场：交接 / 在做 / 可认领
          \`\`\`

          校验和（SHA-256）见同名 \`.sha256\` 文件。
          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: agent-kanban ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            release-assets/kanban-*
            release-assets/*.sha256
            release-notes.md
          fail_on_unmatched_files: true
