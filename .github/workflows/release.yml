# =============================================================================
# Release: tag push -> cross-platform binaries + Docker images + GitHub Release
# =============================================================================
# Triggered by pushing a tag shaped like v1.2.3
#
# Artifacts:
#   - Self-contained binaries for 5 platforms (`bun build --compile`; download and
#     run, no bun installation required)
#   - Docker images (linux/amd64 + linux/arm64) pushed to GHCR only
#   - GitHub Release with binaries and checksums
#
# Three hard constraints (read before editing this workflow):
#   1. The tag must match package.json.version - the version has exactly one source.
#      Otherwise "which version is this binary?" becomes unanswerable.
#   2. schema.sql must be embedded via `with { type: "file" }` (src/core/db.ts).
#      Missing it fails with ENOENT at runtime and is completely invisible at compile
#      time, so every platform gets a smoke test.
#   3. Tests run before artifacts ship - a release must never be red.
# =============================================================================

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create Release / upload assets
  packages: write # push to GHCR

concurrency:
  # Cancel the previous run of the same tag; different tags run in parallel
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  # ---------------------------------------------------------------------------
  # Gate: version consistency + green tests
  # ---------------------------------------------------------------------------
  verify:
    name: Version check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Single source of truth for the version: tag v1.2.3 must equal package.json 1.2.3
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag version ($TAG) does not match package.json ($PKG)"
            echo "Update and commit package.json before releasing, or push the correct tag"
            exit 1
          fi
          echo "Versions match: $PKG"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      # Guards against undeclared packages that bun's auto-install masks locally
      - name: Verify dependency declarations
        run: bun run verify:deps

      # Order matters: build the frontend, then generate the asset manifest.
      # The published binaries must carry the web UI inside them.
      - name: Build frontend and asset manifest
        run: |
          cd web && bun run build
          cd .. && bun run gen:assets

      - name: Typecheck (backend)
        run: bun run typecheck

      - name: Typecheck (frontend)
        run: bun run typecheck
        working-directory: web

      - name: Unit tests
        run: bun test

      # End-to-end scripts: crash recovery / event replay / remote dual-mode / web board.
      # They each boot a throwaway server and clean up after themselves.
      - name: End-to-end verification
        run: |
          bun run scripts/verify-recovery.ts
          bun run scripts/verify-rebuild.ts
          bun run scripts/verify-auth.ts
          bun run scripts/verify-remote.ts
          bun run scripts/verify-web.ts

  # ---------------------------------------------------------------------------
  # Cross-platform binaries
  # ---------------------------------------------------------------------------
  binary:
    name: Binary ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            asset: kanban-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-latest
            asset: kanban-linux-arm64
          - target: bun-darwin-x64
            os: macos-latest
            asset: kanban-darwin-x64
          - target: bun-darwin-arm64
            os: macos-latest
            asset: kanban-darwin-arm64
          - target: bun-windows-x64
            os: windows-latest
            asset: kanban-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The binary does not depend on node_modules, but `bun build` still resolves
      # imports, so install first.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        shell: bash
        run: |
          # Order matters: build frontend -> generate asset manifest -> compile.
          # Skipping a step still compiles successfully, it just ships a binary with
          # no web UI (`/` falls back to the placeholder page).
          bun run gen:assets
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} \
            src/cli.ts --outfile "dist/${{ matrix.asset }}"
          ls -lh dist/

      # Critical smoke test: a missing embedded schema.sql is invisible at compile
      # time, so the artifact must actually run `init` **on the target platform**.
      # An arm64 artifact cannot execute on an x64 runner, hence the containerized check.
      - name: Smoke test (version + init)
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.asset }}"

          if [ "${{ matrix.target }}" = "bun-linux-arm64" ]; then
            # Cannot run arm64 on an x64 runner: go through qemu emulation
            docker run --rm --platform linux/arm64 -v "$PWD/dist:/d" \
              oven/bun:1.4.2-alpine /d/${{ matrix.asset }} --version
            docker run --rm --platform linux/arm64 -v "$PWD/dist:/d" -v "$PWD/smoke:/w" \
              -w /w oven/bun:1.4.2-alpine /d/${{ matrix.asset }} init
            echo "arm64 smoke test passed (qemu)"
            exit 0
          fi

          chmod +x "$BIN" || true
          "$BIN" --version
          mkdir -p smoke
          ( cd smoke && "../$BIN" init >/dev/null && "../$BIN" task add "release smoke task" >/dev/null && \
            "../$BIN" --json task list | grep -q T-0001 )
          echo "Smoke test passed: init / task add / task list"

      - name: Checksum
        id: sum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            # macOS
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker images (multi-arch)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # ⚠ GitHub owner names may contain uppercase (ArnoChenFx), but a registry
      #   repository path must be **all lowercase**, or buildx refuses outright:
      #     invalid tag "ghcr.io/ArnoChenFx/...": repository name must be lowercase
      #   Lowercase once here and reference the output everywhere else, so no step
      #   can reintroduce the raw value.
      #   Note github.repository is already `owner/repo`; appending another
      #   `/agent-kanban` would produce `owner/repo/agent-kanban`.
      #   Keep docker-compose.yml's default image in sync with this.
      - name: Resolve image coordinates
        id: meta
        shell: bash
        run: |
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "resolved: ghcr.io/${REPO}:${{ github.ref_name }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr }}:latest
          labels: |
            org.opencontainers.image.title=agent-kanban
            org.opencontainers.image.description=Project-scoped shared task board for multi-agent sessions (server)
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Record the image digest so the Release can reference it
      - name: Record image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }} \
            --format '{{json .Manifest}}' | head -c 200 || echo "unknown")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [binary, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name 'kanban-*' \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      # Release notes stay in Chinese on purpose: they are product content for the
      # people who download and use this project, not workflow machinery.
      - name: Generate release notes
        run: |
          cat > release-notes.md <<EOF
          ## agent-kanban ${{ github.ref_name }}

          多会话 agent 共享的项目级任务看板：任务共享、进度可追溯，agent 崩溃后能恢复上下文与交接。

          ### 下载

          | 平台 | 文件 |
          | --- | --- |
          | Linux x64 | \`kanban-linux-x64\` |
          | Linux arm64 | \`kanban-linux-arm64\` |
          | macOS x64 | \`kanban-darwin-x64\` |
          | macOS arm64 | \`kanban-darwin-arm64\` |
          | Windows x64 | \`kanban-windows-x64.exe\` |

          二进制是**自包含**的（内嵌 bun 运行时与数据库 schema），下载即用，无需安装 bun。
          Linux 版本需给执行权限：\`chmod +x kanban-linux-x64\`。

          ### Docker

          \`\`\`bash
          # 启动 server（Web 看板 + CLI 远程后端）
          docker run -d --name kanban -p 7788:7788 -v kanban-data:/data \\
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}

          # 首次启动会打印管理员 token，用它签发 project token
          docker logs kanban
          \`\`\`

          数据卷 \`/data\` 存放 project、token、任务与交接；换机器时备份这个目录即可迁移。

          常用环境变量：\`KANBAN_PORT\`（默认 7788）、\`KANBAN_HOST\`（默认 0.0.0.0）、\`KANBAN_WEB_DIR\`。

          ### 快速开始

          \`\`\`bash
          kanban init                      # 初始化本地看板
          kanban session start --agent pi-main
          kanban task add "实现存储层"
          kanban context                   # 读现场：交接 / 在做 / 可认领
          \`\`\`

          校验和（SHA-256）见同名 \`.sha256\` 文件。
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: agent-kanban ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            release-assets/kanban-*
            release-assets/*.sha256
            release-notes.md
          fail_on_unmatched_files: true
