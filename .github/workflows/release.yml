# =============================================================================
# Release: tag push -> cross-platform binaries + Docker images + GitHub Release
# =============================================================================
# Triggered by pushing a tag shaped like v1.2.3
#
# Artifacts:
#   - Self-contained binaries for 4 platforms (`bun build --compile`; download and
#     run, no bun installation required)
#   - Docker images (linux/amd64 + linux/arm64) pushed to GHCR only
#   - GitHub Release with binaries and checksums
#
# Three hard constraints (read before editing this workflow):
#   1. The tag must match package.json.version - the version has exactly one source.
#      Otherwise "which version is this binary?" becomes unanswerable.
#   2. schema.sql must be embedded via `with { type: "file" }` (src/core/db.ts).
#      Missing it fails with ENOENT at runtime and is completely invisible at compile
#      time, so every platform gets a smoke test.
#   3. Tests run before artifacts ship - a release must never be red.
# =============================================================================

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create Release / upload assets
  packages: write # push to GHCR

concurrency:
  # Cancel the previous run of the same tag; different tags run in parallel
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  # ---------------------------------------------------------------------------
  # Gate: version consistency + green tests
  # ---------------------------------------------------------------------------
  verify:
    name: Version check and tests
    runs-on: ubuntu-latest
    outputs:
      # Counted once here and passed down as a job output.
      # Do NOT re-derive it in the release job with `grep -c 'target: bun-'` on this
      # same file: that grep command line matches the pattern too, inflating the count
      # by one and failing with "expected 5, found 4". The `^ *-` anchor below counts
      # matrix entries only, so nothing else can match.
      platforms: ${{ steps.count.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `^ *-` anchors to the start of the line, so only matrix entries match.
      # `[[:space:]]` would work in GNU grep but not in .NET regexes, which makes
      # the rule awkward to reproduce locally; `^ *` behaves identically in both.
      - name: Count release targets
        id: count
        run: |
          COUNT=$(grep -cE '^ *- target: bun-' .github/workflows/release.yml || true)
          COUNT="${COUNT:-0}"
          echo "platforms=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "release targets: ${COUNT}"

      # Single source of truth for the version: tag v1.2.3 must equal package.json 1.2.3
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag version ($TAG) does not match package.json ($PKG)"
            echo "Update and commit package.json before releasing, or push the correct tag"
            exit 1
          fi
          echo "Versions match: $PKG"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      # Guards against undeclared packages that bun's auto-install masks locally
      - name: Verify dependency declarations
        run: bun run verify:deps

      # Order matters: build the frontend, then generate the asset manifest.
      # The published binaries must carry the web UI inside them.
      - name: Build frontend and asset manifest
        run: |
          cd web && bun run build
          cd .. && bun run gen:assets

      - name: Typecheck (backend)
        run: bun run typecheck

      - name: Typecheck (frontend)
        run: bun run typecheck
        working-directory: web

      - name: Unit tests
        run: bun test

      # End-to-end scripts: crash recovery / event replay / remote dual-mode / web board.
      # They each boot a throwaway server and clean up after themselves.
      - name: End-to-end verification
        run: |
          bun run scripts/verify-recovery.ts
          bun run scripts/verify-rebuild.ts
          bun run scripts/verify-auth.ts
          bun run scripts/verify-remote.ts
          bun run scripts/verify-web.ts

  # ---------------------------------------------------------------------------
  # Cross-platform binaries
  # ---------------------------------------------------------------------------
  binary:
    name: Binary ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            asset: kanban-linux-x64
          - target: bun-darwin-x64
            os: macos-latest
            asset: kanban-darwin-x64
          - target: bun-darwin-arm64
            os: macos-latest
            asset: kanban-darwin-arm64
          - target: bun-windows-x64
            os: windows-latest
            asset: kanban-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The binary does not depend on node_modules, but `bun build` still resolves
      # imports, so install first.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        shell: bash
        run: |
          # Order matters: build frontend -> generate asset manifest -> compile.
          # Skipping a step still compiles successfully, it just ships a binary with
          # no web UI (`/` falls back to the placeholder page).
          bun run gen:assets
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} \
            src/cli.ts --outfile "dist/${{ matrix.asset }}"
          ls -lh dist/

      # Critical smoke test: a missing embedded schema.sql is invisible at compile
      # time, so the artifact must actually run `init` **on the target platform**.
      # Every target below can execute natively on its runner, so no emulation
      # branch is needed.
      - name: Smoke test (version + init)
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.asset }}"

          chmod +x "$BIN" || true
          "$BIN" --version
          mkdir -p smoke
          ( cd smoke && "../$BIN" init >/dev/null && "../$BIN" task add "release smoke task" >/dev/null && \
            "../$BIN" --json task list | grep -q T-0001 )
          echo "Smoke test passed: init / task add / task list"

      - name: Checksum
        id: sum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            # macOS
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker images (multi-arch)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Feeds the release job so the notes can show a pinnable digest
      digest: ${{ steps.digest.outputs.digest }}
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # ⚠ GitHub owner names may contain uppercase (ArnoChenFx), but a registry
      #   repository path must be **all lowercase**, or buildx refuses outright:
      #     invalid tag "ghcr.io/ArnoChenFx/...": repository name must be lowercase
      #   Lowercase once here and reference the output everywhere else, so no step
      #   can reintroduce the raw value.
      #   Note github.repository is already `owner/repo`; appending another
      #   `/agent-kanban` would produce `owner/repo/agent-kanban`.
      #   Keep docker-compose.yml's default image in sync with this.
      - name: Resolve image coordinates
        id: meta
        shell: bash
        run: |
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "resolved: ghcr.io/${REPO}:${{ github.ref_name }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr }}:latest
          labels: |
            org.opencontainers.image.title=agent-kanban
            org.opencontainers.image.description=Project-scoped shared task board for multi-agent sessions (server)
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Record the image digest so the Release can show it, letting users pin an
      # exact image with `docker pull image@sha256:...`.
      #
      # ⚠ Two mistakes this step used to make, both invisible until CI ran:
      #   1. A byte limit truncated a multi-line JSON manifest mid-object.
      #   2. Writing that multi-line result to $GITHUB_OUTPUT as `key=value`:
      #      GitHub parses every line as its own key, so the leftover JSON
      #      fragment failed with "Invalid format".
      #   Extracting a single-line digest sidesteps both.
      - name: Record image digest
        id: digest
        shell: bash
        env:
          IMAGE: "${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}"
        run: |
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" 2>/dev/null \
            | grep -o 'sha256:[0-9a-f]\{64\}' | head -1 || true)"
          DIGEST="${DIGEST:-unknown}"
          echo "Resolved ${IMAGE} -> ${DIGEST}"
          {
            echo "digest=${DIGEST}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [verify, binary, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ⚠ **pattern is required, not an optimisation.**
      #   `cache-to: type=gha` in the docker jobs creates an extra artifact named
      #   `<owner>~<repo>~<id>.dockerbuild`. Downloading "everything" pulls that
      #   build cache in too, and it is large, short-lived, and can fail to fetch
      #   (observed: "Artifact download failed after 5 retries") — taking the whole
      #   Release down even though the binaries had downloaded fine.
      #   The Release only ever needs the four bin-* artifacts.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bin-*
          merge-multiple: true

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'kanban-*' -exec cp {} release-assets/ \;
          ls -lh release-assets/
          # Fail loudly if a platform artifact is missing, rather than publishing a
          # Release that silently offers one fewer download.
          # Expected count comes from the verify job (needs.verify.outputs.platforms),
          # derived from the matrix itself, so adding or removing a platform later
          # needs no edit here.
          EXPECTED="${{ needs.verify.outputs.platforms }}"
          COUNT=$(ls -1 release-assets/kanban-* 2>/dev/null | grep -vc '\.sha256$' || true)
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::expected ${EXPECTED} platform binaries, found ${COUNT}:"
            ls -1 release-assets/ || true
            exit 1
          fi
          echo "collected ${COUNT}/${EXPECTED} platform binaries"

      # Release notes are user-facing product content, so they follow the repository
      # default (English) rather than the workflow's English-only rule for machinery.
      - name: Generate release notes
        run: |
          cat > release-notes.md <<EOF
          ## agent-kanban ${{ github.ref_name }}

          A project-scoped task board shared by multiple agent sessions: tasks are shared,
          progress stays traceable, and a crashed agent can be picked up mid-task with its
          context and handoff intact.

          ### Download

          | Platform | File |
          | --- | --- |
          | Linux x64 | \`kanban-linux-x64\` |
          | macOS x64 | \`kanban-darwin-x64\` |
          | macOS arm64 | \`kanban-darwin-arm64\` |
          | Windows x64 | \`kanban-windows-x64.exe\` |

          The binaries are **self-contained** (the Bun runtime and the database schema are
          embedded), so download and run, no bun installation required.
          On Linux: \`chmod +x kanban-linux-x64\`.

          No Linux arm64 binary is published. Use the Docker image, which resolves the
          architecture for you.

          ### Docker

          \`\`\`bash
          # Start the server (web board + remote backend for the CLI)
          docker run -d --name kanban -p 7788:7788 -v kanban-data:/data \\
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}

          # First boot prints the admin token once; use it to issue project tokens
          docker logs kanban
          \`\`\`

          The \`/data\` volume holds projects, tokens, tasks, and handoffs. Back up that one
          directory to move the board to another machine.

          Image digest (pin an exact build with it):

          \`\`\`
          ${{ needs.docker.outputs.image }}
          ${{ needs.docker.outputs.digest }}
          \`\`\`

          Common environment variables: \`KANBAN_PORT\` (default 7788), \`KANBAN_HOST\`
          (default 0.0.0.0), \`KANBAN_WEB_DIR\`.

          ### Quick start

          \`\`\`bash
          kanban init                      # create a local board
          kanban session start --agent pi-main
          kanban task add "implement the storage layer"
          kanban context                   # read the situation: handoffs, your cards, what is free
          \`\`\`

          SHA-256 checksums are in the matching \`.sha256\` files.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: agent-kanban ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            release-assets/kanban-*
            release-assets/*.sha256
            release-notes.md
          fail_on_unmatched_files: true
