# =============================================================================
# Continuous integration: run on every push / PR, never publishes anything
# =============================================================================
# Overlaps with the verify job in release.yml, but exists separately on purpose:
#   - A PR should tell you whether tests pass, instead of finding out after merge
#     when someone cuts a tag.
#   - release.yml's gate is the last line of defense; it must not replace day-to-day CI.
# =============================================================================

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  test:
    name: Test and typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      # Catches the classic "green locally, red on CI" failure: bun's auto-install
      # silently adds undeclared packages to node_modules, but
      # `bun install --frozen-lockfile` only installs what the lockfile lists.
      # Scans TS imports plus CSS @import / @plugin / @source.
      - name: Verify dependency declarations
        run: bun run verify:deps

      - name: Typecheck (backend)
        run: bun run typecheck

      - name: Typecheck (frontend)
        shell: bash
        run: cd web && bun run typecheck

      - name: Unit tests
        run: bun test

      # Keeps workflow scaffolding in English (job/step names, comments, logs)
      - name: Verify workflow files
        run: bun run verify:workflows

      - name: Verify documentation accuracy
        run: bun run verify:docs

      - name: MCP end-to-end
        run: bun run scripts/verify-mcp.ts

      - name: Backup and maintenance
        run: bun run scripts/verify-backup.ts

      # Catches "someone committed the build output": a real asset manifest
      # references web/dist by literal path, which cannot resolve on a clean
      # checkout. Runs here because this job never builds the frontend, so the
      # check cannot be masked by build ordering.
      - name: Verify deployment config
        run: bun run verify:deploy

  build:
    name: Frontend build and binary smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build
        working-directory: web

      - name: Verify frontend output
        run: |
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing"; exit 1; }
          grep -q 'id="root"' web/dist/index.html || { echo "::error::index.html is not the board entry point"; exit 1; }
          echo "Frontend output looks good"

      # Structural check of the deployment files
      - name: Verify deployment config
        run: bun run scripts/verify-deploy.ts

      # Keeps workflow scaffolding in English (job/step names, comments, logs)
      - name: Verify workflow files
        run: bun run verify:workflows

      # This smoke test guards exactly two things:
      #   1. schema.sql is not embedded (invisible at compile time, ENOENT at runtime)
      #   2. Frontend assets are not embedded (no web/dist in the binary, so `/`
      #      silently falls back to the placeholder page)
      - name: Compile and smoke test Linux binary
        run: |
          set -euo pipefail
          bun run gen:assets
          mkdir -p dist smoke
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist/kanban
          chmod +x dist/kanban
          dist/kanban --version
          ( cd smoke && ../dist/kanban init >/dev/null && \
            ../dist/kanban task add "CI smoke task" >/dev/null && \
            ../dist/kanban --json task list | grep -q T-0001 )
          echo "Binary smoke test passed"

      # Required before any `cache-to: type=gha`. The runner's default builder
      # uses the `docker` driver, which cannot export to the GHA cache backend
      # ("Cache export is not supported for the docker driver"). setup-buildx
      # switches to the `docker-container` driver, which can.
      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary:
    name: Self-contained binary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `web/` is a separate package with its own lockfile. This job builds the
      # frontend, so it needs web's dependencies too — installing only the root
      # leaves `vite` and its type definitions missing, and the build then fails
      # with TS2688 (`vite/client`) and TS2307.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build
        working-directory: web

      - name: Generate asset manifest and compile
        run: |
          bun run gen:assets
          mkdir -p dist-test
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist-test/kanban

      # The point: run the binary in a directory with **no source and no web/dist**,
      # which proves schema.sql and the frontend assets are really embedded rather
      # than merely found next to the sources.
      - name: Verify binary is self-contained
        run: bun run scripts/verify-binary.ts

  e2e:
    name: End-to-end verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies and build frontend
        run: |
          bun install --frozen-lockfile
          # One `cd` only: every line of a `run:` block shares the same shell, so
          # a second `cd web` would run from inside web/ and fail with ENOENT.
          cd web && bun install --frozen-lockfile && bun run build

      # These scripts each boot a throwaway server and drive the real thing through
      # child processes, which catches cross-process / cross-environment failures
      # (CLI argument parsing, token propagation, static assets) that unit tests miss.
      - name: Crash recovery
        run: bun run scripts/verify-recovery.ts

      - name: Event replay and self-verification
        run: bun run scripts/verify-rebuild.ts

      - name: Configuration and permissions
        run: bun run scripts/verify-auth.ts

      - name: Remote dual-mode backend
        run: bun run scripts/verify-remote.ts

      - name: Web board
        run: bun run scripts/verify-web.ts

      - name: MCP end-to-end
        run: bun run scripts/verify-mcp.ts

      - name: Backup and maintenance
        run: bun run scripts/verify-backup.ts

      - name: Verify deployment config
        run: bun run scripts/verify-deploy.ts
